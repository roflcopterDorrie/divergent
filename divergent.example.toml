# Copy this file to divergent.toml at the root of your main repo.
# Paths are relative to the config file's directory, or absolute.
variations = [
  "../variation-1",
  "../variation-2",
]

# Branch on each variation repo to compare against (and to branch from in the sync script).
variation_base_branch = "develop"

# Main repo should be on a branch matching this regex (e.g. feature/123).
# Mismatch is a warning; comparison still runs.
main_branch_pattern = "^feature/.+"
